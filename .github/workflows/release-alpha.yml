name: Release alpha

# Cuts a pre-release such as 3.1.0-alpha.1 from the current head of main, for
# testers who install through BRAT. See ADR-0030, "Amendment: alpha
# pre-releases".
#
# What keeps it away from everyone else: Obsidian's store reads the version
# from manifest.json on main and downloads the release whose tag equals it.
# This workflow never changes main. It makes a commit that exists only under
# the tag, with the alpha version in package.json and manifest.json, and
# release.yml publishes that tag as a prerelease (its tag has a hyphen).
#
# The approval gate is the same `release` environment as a stable release.

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: MAJOR.MINOR.PATCH the alpha leads up to. Must be higher than the stable version on main
        type: string
        required: true
      alpha_number:
        description: The N in X.Y.Z-alpha.N
        type: string
        required: true
        default: "1"

concurrency:
  group: release-alpha
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Refuse a dispatch from any ref but main
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" != "main" ]]; then
            echo "::error::Refusing to cut an alpha from '$REF_NAME'. Dispatch this workflow from main."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Is the version acceptable?
        id: version
        env:
          ALPHA_BASE: ${{ inputs.base_version }}
          ALPHA_NUMBER: ${{ inputs.alpha_number }}
        run: bun scripts/alpha.ts --check

      - name: Is the tag free?
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]]; then
            echo "::error::Tag $VERSION already exists. Use the next alpha number."
            exit 1
          fi

      - name: Summarise what the approver is about to tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Alpha $VERSION is ready to tag"
            echo
            echo "Commit \`$(git rev-parse --short HEAD)\`: $(git log -1 --pretty=%s)"
            echo
            echo "main keeps the stable version. The tag points at a separate commit that only carries the alpha version."
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    needs: check
    runs-on: ubuntu-latest
    # Required reviewers live on this environment, as for a stable release.
    environment: release
    steps:
      # Minted here, after the approval, and never passed between jobs.
      - name: Create the App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # No `ref:` override, as in release-tag.yml: the checkout is the commit
      # that was dispatched, and the step below refuses if main moved while
      # this job waited for approval.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Refuse if main moved during the approval
        shell: bash
        run: |
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::main moved while this job waited for approval. Dispatch again at the new head."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set the git identity to the App's bot
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Give package.json and manifest.json the alpha version
        env:
          ALPHA_BASE: ${{ inputs.base_version }}
          ALPHA_NUMBER: ${{ inputs.alpha_number }}
        run: bun scripts/alpha.ts

      # The commit is reachable from the tag only: no branch moves, so main
      # and the store's manifest are untouched. The push uses the App token so
      # that release.yml, which triggers on tag pushes, actually runs.
      - name: Commit under the tag
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git commit -am "chore: alpha $VERSION"
          git tag "$VERSION"

      - name: Push the tag
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: git push origin "refs/tags/$VERSION"
